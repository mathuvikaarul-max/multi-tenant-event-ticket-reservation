
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventify | Ticket Reservation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>🎟️ Eventify</h2>
    <nav>
      <a href="#home">Home</a>
      <a href="#events">Events</a>
      <a href="#bookings">My Bookings</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Discover Amazing Events</h1>
    <p>Find your next experience. Book your tickets today!</p>
    <a href="#events" class="btn">Explore Events</a>
  </section>

  <section class="events" id="events">
    <h2>Upcoming Events</h2>
    <div class="event-container" id="eventContainer"></div>
  </section>

  <section class="bookings" id="bookings">
    <h2>My Bookings</h2>
    <div id="bookingList">No bookings yet.</div>
  </section>

  <footer>
    <p>© 2026 Eventify | Event & Ticket Reservation System</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
